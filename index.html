<!doctype html>
<html lang="es">
<head>

<title>Previa Ponerle</title>
<style>

html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
canvas{width:100vw;height:100vh;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;display:block}

<body>
<canvas id="c" width="320" height="180"></canvas>
<div id="hint">F o doble clic: pantalla completa · M: música · ← →: cambiar escena</div>
<script>
/* ==========================================================================
   PREVIA "PONERLE" — Horacio Rebolledo · concierto pre estreno
   Animación pixel art en loop para proyectar mientras llega el público.
   Opciones por URL:  ?hora=21:30  muestra cuenta regresiva
                      ?musica=1    arranca con música (requiere un clic)
                      ?escena=N    empieza en la escena N (0..10)
   ========================================================================== */
const CONFIG={
  artista:'HORACIO REBOLLEDO',
  banda:'Y EL TRIPULAO',
  titulo:'PONERLE',
  sub:'SEGUNDA PRODUCCIÓN MUSICAL',
  badge:'CONCIERTO PRE ESTRENO',
  mensajes:[
    'BIENVENIDOS AL CONCIERTO PRE ESTRENO DE "PONERLE"',
    'HORACIO REBOLLEDO Y EL TRIPULAO · SEGUNDA PRODUCCIÓN MUSICAL',
    'POR FAVOR SILENCIA TU CELULAR',
    'ESTA NOCHE SUENA: #SETLIST#',
    'SUBE A BORDO: EL TRIPULAO ZARPA EN UNOS MINUTOS',
    'DESDE CASTRO, CHILOÉ, PARA TODOS USTEDES',
  ],
  setlist:['PONERLE','AMOR DIVINO','LA PERICONA SUEÑA ENAMORARSE','BENDITA EXISTENCIA',
           'EL VIEJO','SIRILLA DE LA ESPERANZA','SOLDADO QUE ARRANCA','A PENALES'],
};
CONFIG.mensajes=CONFIG.mensajes.map(m=>m.replace('#SETLIST#',CONFIG.setlist.join(' · ')));
/* Integrantes. "rol" admite | para partir en dos líneas. Sin nombre = no sale en la presentación. */
const BAND={
  hora:{rol:'GUITARRA ACÚSTICA|Y COMPOSICIÓN',nombre:'HORACIO REBOLLEDO',skin:'#e0a882',hair:'#161010',hs:'short',shirt:'#4a2a7a',jacket:'#2a4a8c',pants:'#18181f',shoes:'#8a5a2c',inst:'guitar',k:0},
  sax1:{rol:'SAXO TENOR',nombre:'CRISTÓBAL DEL RÍO',skin:'#c89070',hair:'#5a5a5a',hs:'cap',cap:'#3a3a40',capd:'#24242a',beard:'#6a6060',shirt:'#26402e',flor:1,pants:'#24304c',shoes:'#202020',inst:'sax',k:1},
  sax2:{rol:'SAXO ALTO',nombre:'MIGUEL RAZZOUK',skin:'#c48a66',hair:'#1a1210',hs:'long',beard:'#2a1a14',shirt:'#3a3238',pants:'#18181f',shoes:'#2a2020',inst:'sax',k:2},
  tpt:{rol:'TROMPETA',nombre:'ROBERTO ANDRADE',skin:'#d8a07a',hair:'#1a1414',hs:'short',glasses:1,shirt:'#161616',arm:'#d8a07a',tattoo:1,pants:'#a8a8ae',shoes:'#f0f0f0',inst:'trumpet',k:3},
  bat:{rol:'BATERÍA',nombre:'PEPE GARRIDO',skin:'#b8805a',hair:'#1a1210',hs:'curly',beard:'#2a1a14',shirt:'#e8d89a',pants:'#c0a070',shoes:'#2a2020',inst:'drum',k:4},
  acor:{rol:'ACORDEÓN',nombre:'',skin:'#e0aa86',hair:'#2a1c14',hs:'short',glasses:1,shirt:'#ececf2',pants:'#18181f',shoes:'#101010',inst:'accordion',k:5},
  guit:{rol:'GUITARRA ELÉCTRICA|Y ELECTROACÚSTICA',nombre:'OSCAR CONEJEROS',skin:'#dca27c',hair:'#1a1210',hs:'swept',glasses:1,shirt:'#b02424',jacket:'#c8a070',pants:'#18181f',shoes:'#3a2a1a',inst:'egtr',gc:'#7a2a1a',k:6},
  bajo:{rol:'BAJO',nombre:'JACK MUNDARAIN',skin:'#d09a76',hair:'#4a4440',hs:'short',beard:'#3a3430',shirt:'#3a5a8a',pants:'#18181f',shoes:'#3a2a1a',inst:'bass',gc:'#d8a860',k:7},
};
/* orden en línea, como en el afiche */
const ORDER=['sax2','sax1','guit','hora','bat','bajo','acor','tpt'].map(k=>BAND[k]);
const PRES=['hora','guit','bajo','bat','sax2','sax1','tpt'].map(k=>BAND[k]).filter(m=>m.nombre);

const Q=new URLSearchParams(location.search);
const W=320,H=180,GH=170; // GH: alto útil (abajo va la cinta de mensajes)
const BPM=100,BPS=BPM/60;
const cv=document.getElementById('c');
let ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;

/* ---------- utilidades de pixel ---------- */
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function P(x,y,c){R(x,y,1,1,c);}
function line(x0,y0,x1,y1,c){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(;;){P(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}
}
function oval(cx,cy,rx,ry,c){for(let dy=-Math.round(ry);dy<=Math.round(ry);dy++){const w=rx*Math.sqrt(Math.max(0,1-(dy/ry)**2));R(cx-w,cy+dy,2*w,1,c);}}
function tri(cx,by,hw,h,c){for(let r=0;r<h;r++){const w=Math.max(.5,hw*(1-r/h));R(cx-w,by-1-r,2*w,1,c);}}
function alpha(a,fn){const g=ctx.globalAlpha;ctx.globalAlpha=g*Math.max(0,Math.min(1,a));fn();ctx.globalAlpha=g;}
function shade(a,c='#000'){if(a>0)alpha(a,()=>R(0,0,W,H,c));}
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=u=>u<.5?2*u*u:1-(-2*u+2)**2/2;
let seed=7;function srand(s){seed=s;}
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
function grad(y0,y1,cols){
  const n=cols.length,h=(y1-y0)/n;
  for(let i=0;i<n;i++){R(0,y0+i*h,W,h+1,cols[i]);if(i){const yy=Math.round(y0+i*h);for(let x=0;x<W;x+=2)P(x+(yy&1),yy,cols[i-1]);}}
}

/* ---------- fuente 3x5 escalable ---------- */
const FONT={A:[2,5,7,5,5],B:[6,5,6,5,6],C:[3,4,4,4,3],D:[6,5,5,5,6],E:[7,4,6,4,7],F:[7,4,6,4,4],G:[3,4,5,5,3],H:[5,5,7,5,5],
I:[7,2,2,2,7],J:[1,1,1,5,2],K:[5,5,6,5,5],L:[4,4,4,4,7],M:[5,7,7,5,5],N:[6,5,5,5,5],O:[2,5,5,5,2],P:[6,5,6,4,4],Q:[2,5,5,6,3],
R:[6,5,6,5,5],S:[3,4,2,1,6],T:[7,2,2,2,2],U:[5,5,5,5,7],V:[5,5,5,5,2],W:[5,5,7,7,5],X:[5,5,2,5,5],Y:[5,5,2,2,2],Z:[7,1,2,4,7],
0:[7,5,5,5,7],1:[2,6,2,2,7],2:[6,1,2,4,7],3:[6,1,2,1,6],4:[5,5,7,1,1],5:[7,4,6,1,6],6:[3,4,7,5,7],7:[7,1,1,2,2],8:[7,5,7,5,7],9:[7,5,7,1,6],
':':[0,2,0,2,0],'/':[1,1,2,4,4],'.':[0,0,0,0,2],',':[0,0,0,2,4],'-':[0,0,7,0,0],'?':[6,1,2,0,2],'!':[2,2,2,0,2],'¡':[2,0,2,2,2],
'+':[0,2,7,2,0],'"':[5,5,0,0,0],"'":[2,2,0,0,0],'·':[0,0,2,0,0],'#':[7,0,6,5,5]};
function norm(s){return String(s).toUpperCase().replace(/Ñ/g,'#').normalize('NFD').replace(/[̀-ͯ]/g,'');}
function tw(s,k=1){return norm(s).length*4*k-k;}
function txt(s,x,y,c,k=1,al=0){
  s=norm(s);const w=s.length*4*k-k;if(al===1)x-=w>>1;else if(al===2)x-=w;x=Math.round(x);
  for(let i=0;i<s.length;i++){const g=FONT[s[i]];if(!g)continue;
    for(let r=0;r<5;r++)for(let b=0;b<3;b++)if(g[r]&(4>>b))R(x+(i*4+b)*k,y+r*k,k,k,c);}
}
function txtSh(s,x,y,c,k=1,al=0,sh='#000',d=1){txt(s,x+d,y+d,sh,k,al);txt(s,x,y,c,k,al);}
const F5={A:[14,17,17,31,17,17,17],B:[30,17,17,30,17,17,30],C:[14,17,16,16,16,17,14],D:[30,17,17,17,17,17,30],E:[31,16,16,30,16,16,31],
F:[31,16,16,30,16,16,16],G:[14,17,16,23,17,17,15],H:[17,17,17,31,17,17,17],I:[14,4,4,4,4,4,14],J:[7,2,2,2,2,18,12],K:[17,18,20,24,20,18,17],
L:[16,16,16,16,16,16,31],M:[17,27,21,21,17,17,17],N:[17,17,25,21,19,17,17],O:[14,17,17,17,17,17,14],P:[30,17,17,30,16,16,16],Q:[14,17,17,17,21,18,13],
R:[30,17,17,30,20,18,17],S:[15,16,16,14,1,1,30],T:[31,4,4,4,4,4,4],U:[17,17,17,17,17,17,14],V:[17,17,17,17,17,10,4],W:[17,17,17,21,21,21,10],
X:[17,17,10,4,10,17,17],Y:[17,17,10,4,4,4,4],Z:[31,1,2,4,8,16,31],0:[14,17,19,21,25,17,14],1:[4,12,4,4,4,4,14],2:[14,17,1,2,4,8,31],
3:[31,2,4,2,1,17,14],4:[2,6,10,18,31,2,2],5:[31,16,30,1,1,17,14],6:[6,8,16,30,17,17,14],7:[31,1,2,4,8,8,8],8:[14,17,17,14,17,17,14],
9:[14,17,17,15,1,2,12],':':[0,12,12,0,12,12,0],'!':[4,4,4,4,4,0,4],'¡':[4,0,4,4,4,4,4],'"':[10,10,10,0,0,0,0],'/':[1,1,2,4,8,16,16],
'#':[14,0,17,25,21,19,17],'.':[0,0,0,0,0,12,12],'·':[0,0,0,12,12,0,0],'-':[0,0,0,31,0,0,0]};
function twB(s,k=1){return norm(s).length*6*k-k;}
function txtB(s,x,y,c,k=1,al=0){
  s=norm(s);const w=s.length*6*k-k;if(al===1)x-=w>>1;else if(al===2)x-=w;x=Math.round(x);
  for(let i=0;i<s.length;i++){const g=F5[s[i]];if(!g)continue;
    for(let r=0;r<7;r++)for(let b=0;b<5;b++)if(g[r]&(16>>b))R(x+(i*6+b)*k,y+r*k,k,k,c);}
}
function txtBSh(s,x,y,c,k=1,al=0,sh='#000',d=1){txtB(s,x+d,y+d,sh,k,al);txtB(s,x,y,c,k,al);}
function note(x,y,c){R(x+3,y,1,5,c);R(x+4,y,2,1,c);P(x+5,y+1,c);R(x+1,y+4,3,2,c);}
const NOTE_C=['#ffe27a','#ff9ad5','#9ae6ff','#b6ff9a','#ffffff'];
function notes(src,t,rate=.35,rise=38){
  src.forEach(([x,y],i)=>{for(let k=0;k<2;k++){const u=(t*rate+i*.29+k*.5)%1;
    alpha(1-u,()=>note(x+Math.sin(u*7+i)*4-3,y-u*rise,NOTE_C[(i+k)%5]));}});
}

/* ---------- integrantes ---------- */
const FLOR=[[0,1,'#e8c860'],[3,2,'#d05a3a'],[6,1,'#e8e0d0'],[1,4,'#d05a3a'],[5,5,'#e8c860'],[2,7,'#e8e0d0'],[7,7,'#d05a3a'],[4,8,'#e8c860'],[0,8,'#e8c860']];
function arm(x0,y0,x1,y1,c,sk){line(x0,y0,x1,y1,c);line(x0,y0+1,x1,y1+1,c);R(x1,y1,2,2,sk);}
function musico(m,x,y,t,o={}){
  x=Math.round(x);y=Math.round(y);
  const play=o.play!==false,walk=!!o.walk,bt=t*BPS,f=bt%1;
  const b=(play&&!walk&&f<.3)?1:0,s=Math.floor(bt*2)%2;
  if(!o.noShadow)alpha(.35,()=>oval(x,y,7,1.3,'#000'));
  let l1=0,l2=0;if(walk){const w=Math.floor(t*6+m.k)%2;l1=w;l2=1-w;}
  if(!o.kit){
    R(x-3,y-10+b,2,9-b-l1,m.pants);R(x+1,y-10+b,2,9-b-l2,m.pants);
    R(x-4,y-1-l1,3,1,m.shoes);R(x+1,y-1-l2,3,1,m.shoes);
  }
  const Y=y+b,sk=m.skin,ac=m.arm||m.jacket||m.shirt;
  // torso
  R(x-4,Y-19,8,10,m.shirt);
  if(m.flor)for(const[dx,dy,c]of FLOR)P(x-4+dx,Y-19+dy,c);
  if(m.jacket){R(x-4,Y-19,3,10,m.jacket);R(x+1,Y-19,3,10,m.jacket);}
  if(m.arm){R(x-4,Y-19,1,3,m.shirt);R(x+3,Y-19,1,3,m.shirt);}
  // cabeza
  R(x-1,Y-20,2,1,sk);R(x-3,Y-27,6,7,sk);P(x-4,Y-24,sk);P(x+3,Y-24,sk);
  const blink=((t+m.k*1.7)%4)<.13;
  if(!blink){P(x-2,Y-24,'#1a1010');P(x+1,Y-24,'#1a1010');}
  if(m.glasses){const g='#202020';P(x-3,Y-24,g);P(x-1,Y-24,g);P(x,Y-24,g);P(x+2,Y-24,g);R(x-3,Y-25,6,1,g);}
  const wind=m.inst==='sax'||m.inst==='trumpet';
  const sing=m.inst==='guitar'&&play&&(Math.floor(bt)%4!==3)&&f<.7;
  if(m.beard){R(x-3,Y-22,6,2,m.beard);R(x-1,Y-22,2,1,sing?'#5a1a1a':sk);}
  else R(x-1,Y-22,2,1,sing?'#6a1a1a':(wind?sk:'#b06a5a'));
  if(wind&&play){P(x-3,Y-22,'#f0a088');P(x+2,Y-22,'#f0a088');}
  // pelo
  const hc=m.hair;
  switch(m.hs){
    case 'short':R(x-3,Y-28,6,2,hc);P(x-3,Y-26,hc);P(x+2,Y-26,hc);break;
    case 'swept':R(x-3,Y-29,6,3,hc);R(x-4,Y-28,1,3,hc);R(x-3,Y-26,3,1,hc);P(x+2,Y-26,hc);P(x+3,Y-29,hc);break;
    case 'long':R(x-3,Y-28,6,2,hc);R(x-4,Y-27,1,8,hc);R(x+3,Y-27,1,8,hc);P(x-3,Y-26,hc);P(x+2,Y-26,hc);break;
    case 'curly':R(x-4,Y-29,8,3,hc);P(x-4,Y-26,hc);P(x+3,Y-26,hc);P(x-3,Y-30,hc);P(x,Y-30,hc);P(x+2,Y-30,hc);P(x-5,Y-28,hc);P(x+4,Y-28,hc);break;
    case 'cap':R(x-3,Y-29,6,2,m.cap);R(x-4,Y-27,8,1,m.capd);P(x-3,Y-26,hc);P(x+2,Y-26,hc);P(x-1,Y-29,'#5a5a64');break;
  }
  if(o.noInst)return;
  const gold='#e8b84a',gd='#a07820',gl='#fff0a0';
  switch(m.inst){
    case 'guitar':{const st=play?(s?1:-1):0;
      line(x+2,Y-13,x+11,Y-18,'#5a3a1a');line(x+2,Y-14,x+11,Y-19,'#7a5430');R(x+11,Y-21,2,3,'#3a2414');
      oval(x-1,Y-11,4,3,'#c8843c');oval(x+1,Y-13,2.5,2,'#c8843c');R(x-1,Y-13,2,2,'#2a1408');R(x-3,Y-10,3,1,'#5a3418');
      arm(x-4,Y-18,x-2,Y-13+st,ac,sk);arm(x+3,Y-18,x+8,Y-18,ac,sk);break;}
    case 'egtr':case 'bass':{const st=play?(s?1:-1):0,bs=m.inst==='bass',L=bs?14:11;
      line(x+2,Y-13,x+L,Y-17-(bs?2:1),'#d8c090');line(x+2,Y-14,x+L,Y-18-(bs?2:1),'#b89a6a');R(x+L,Y-20-(bs?2:1),2,3,'#2a2a2a');
      oval(x-1,Y-11,bs?4:3.5,bs?3:2.6,m.gc);P(x-4,Y-14,m.gc);R(x-2,Y-12,2,2,'#f0f0f0');R(x-1,Y-10,3,1,'#c0c0c0');
      line(x+3,Y-19,x-4,Y-10,'#2a2a2a');
      arm(x-4,Y-18,x-2,Y-13+st,ac,sk);arm(x+3,Y-18,x+8,Y-17,ac,sk);break;}
    case 'sax':{const sw=play?Math.round(Math.sin(t*BPS*Math.PI)):0,X=x+sw;
      line(x,Y-22,X+1,Y-20,'#303030');R(X+1,Y-20,2,9,gold);P(X+2,Y-19,gl);
      R(X-2,Y-11,5,2,gold);R(X-3,Y-15,2,4,gold);R(X-5,Y-16,5,1,gl);P(X-4,Y-15,gd);
      P(X+1,Y-17,gd);P(X+1,Y-15,gd);P(X+1,Y-13,gd);
      arm(x-4,Y-18,X,Y-18,ac,sk);arm(x+3,Y-17,X+2,Y-14,ac,sk);break;}
    case 'trumpet':{const ty=Y-22-(play&&f<.5?1:0);
      R(x+1,ty,9,1,gold);R(x+3,ty-2,4,2,gd);R(x+3,ty+1,5,1,gold);R(x+10,ty-2,2,5,gl);P(x+11,ty,'#fff');
      arm(x+3,Y-18,x+4,ty+1,ac,sk);arm(x-4,Y-18,x+1,ty+1,ac,sk);
      if(m.tattoo){P(x+3,Y-16,'#3a4a6a');P(x+4,Y-17,'#3a4a6a');}break;}
    case 'accordion':{const e=play?Math.round(1.5+Math.sin(t*BPS*Math.PI*.5)*1.5):1,bw=4+e,tw2=7+bw,L=x-(tw2>>1);
      line(x-3,Y-19,L+1,Y-17,'#1a1a1a');line(x+2,Y-19,L+tw2-2,Y-17,'#1a1a1a');
      R(L,Y-19,3,10,'#f4f4f4');for(let i=0;i<5;i++)R(L+1,Y-18+i*2,2,1,'#1a1a1a');
      for(let i=0;i<bw;i++)R(L+3+i,Y-19,1,10,i%2?'#1a1a1a':'#9a1a1a');
      R(L+3+bw,Y-19,4,10,'#b02a2a');R(L+4+bw,Y-18,2,8,'#2a1a1a');P(L+4+bw,Y-17,'#f0d090');P(L+5+bw,Y-15,'#f0d090');P(L+4+bw,Y-13,'#f0d090');
      arm(x-4,Y-18,L+1,Y-15,ac,sk);arm(x+3,Y-18,L+3+bw,Y-15,ac,sk);break;}
    case 'drum':{const hL=play&&s?3:0,hR=play&&!s?3:0;
      if(!o.kit){R(x-5,Y-12,10,1,'#f4f4f4');R(x-5,Y-11,10,3,'#2a2a30');R(x-5,Y-11,10,1,'#c0c0c8');R(x-5,Y-9,10,1,'#c0c0c8');
        line(x+3,Y-19,x+4,Y-12,'#888');}
      arm(x-4,Y-18,x-5,Y-15-hL,ac,sk);arm(x+3,Y-18,x+3,Y-15-hR,ac,sk);
      line(x-4,Y-15-hL,hL?x-2:x-1,hL?Y-20:Y-12,'#e8d0a0');line(x+4,Y-15-hR,hR?x+6:x+1,hR?Y-20:Y-12,'#e8d0a0');break;}
  }

const mf=n=>440*2**((n-69)/12);
function tone(type,f,t,d,v,f1){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.005);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.02);}

  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+d+.02);}
function sched(){
  while(nextT<AC.currentTime+.15){
    const st=stepN%16,bar=Math.floor(stepN/16)%8,t=nextT;
    if(st===0||st===8)tone('sine',120,t,.18,.5,45);
    if(st%2===0)hiss(t,st%4===2?.09:.04,st%4===2?.18:.08);

    const r=ROOT[bar];
    if(st===0)tone('triangle',mf(r),t,.3,.35);if(st===6)tone('triangle',mf(r+7),t,.2,.3);if(st===8)tone('triangle',mf(r+7),t,.3,.32);if(st===14)tone('triangle',mf(r),t,.15,.28);
    if(st===2||st===6||st===10||st===14)for(const n of CH[bar])tone('square',mf(n),t,.08,.035);
    if(st%2===0){const n=MEL[bar*8+st/2];if(n)tone('square',mf(n+12),t,S16*1.8,.05);}
    nextT+=S16;stepN++;
  }
}
function toggleMusic(){
  if(!AC){AC=new AudioContext();master=AC.createGain();master.gain.value=.22;master.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    setInterval(()=>{if(musicOn)sched();},25);}
  musicOn=!musicOn;
  if(musicOn){AC.resume();nextT=AC.currentTime+.05;}
  master.gain.setTargetAtTime(musicOn?.22:0,AC.currentTime,.05);
  flash(musicOn?'MÚSICA: SÍ':'MÚSICA: NO');
}

/* ---------- bucle principal ---------- */
let sc=clamp(parseInt(Q.get('escena')||0)||0,0,SCENES.length-1),t0=performance.now()/1000,flashMsg='',flashT=-9;
const FREEZE=Q.has('t')?parseFloat(Q.get('t')):null;
function flash(s){flashMsg=s;flashT=performance.now()/1000;}
function go(d){sc=(sc+d+SCENES.length)%SCENES.length;t0=performance.now()/1000;}
function frame(ms){
  const now=ms/1000;let t=now-t0;
  if(FREEZE===null&&t>SCENES[sc].dur){go(1);t=0;}
  if(FREEZE!==null)t=FREEZE;
  const S=SCENES[sc];
  ctx.clearRect(0,0,W,H);
  S.draw(t);
  if(S.song)songCard(S.song,t);
  shade(Math.max(1-t/.6,1-(S.dur-t)/.6));
  ticker(now);
  if(now-flashT<1.5){const w=tw(flashMsg)+10;R(W/2-w/2,150,w,11,'rgba(10,8,20,.85)');txt(flashMsg,W/2,153,'#ffe27a',1,1);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const hint=document.getElementById('hint');

function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='f')fs();else if(k==='m')toggleMusic();
  else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
});
addEventListener('dblclick',fs);
let wantMusic=Q.get('musica')==='1';
addEventListener('pointerdown',()=>{if(wantMusic){wantMusic=false;toggleMusic();}});
